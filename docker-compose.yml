version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: espejo_fantasma
      POSTGRES_PASSWORD: espejo_dev_2026
      POSTGRES_DB: espejo_fantasma_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U espejo_fantasma"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://espejo_fantasma:espejo_dev_2026@postgres:5432/espejo_fantasma_dev
      STRIPE_API_KEY: sk_test_fake_dev_key
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app_couple_endpoints:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
